services:
  # Python FastAPI Web Service
  - type: web
    name: taskflow-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

databases:
  # Managed PostgreSQL Database on Render (or substitute with Neon PostgreSQL)
  - name: taskflow-db
    databaseName: taskflow_db
    user: taskflow_user
    plan: free
